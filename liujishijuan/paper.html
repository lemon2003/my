<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>试卷阅读 | 在线真题</title>
    <link rel="stylesheet" href="assets/css/app.css?v=20261109b" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            (t === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="reader" style="--highlight-selection-color: #ffeb3b80">
      <div class="reader-toolbar">
        <div class="toolbar-row">
          <!-- 左：返回 / 标题 / 缩放 -->
          <div class="toolbar-left">
            <a class="icon-btn sm" href="index.html" data-tip="返回" aria-label="返回" id="backBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
              </svg>
            </a>
            <div class="toolbar-title-group">
              <h1 id="paperTitle">试卷</h1>
              <span class="dot">·</span>
              <span class="date" id="paperDate">—</span>
            </div>
            <div class="zoom-group">
              <button class="ghost-btn" id="zoomOut" type="button" data-tip="缩小">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="8" x2="14" y1="11" y2="11" />
                </svg>
              </button>
              <span class="zoom-value" id="zoomValue">150%</span>
              <button class="ghost-btn" id="zoomIn" type="button" data-tip="放大">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="11" x2="11" y1="8" y2="14" /><line x1="8" x2="14" y1="11" y2="11" />
                </svg>
              </button>
            </div>
          </div>

          <!-- 中：批注工具 -->
          <div class="toolbar-center">
            <button class="tool-btn is-disabled" id="tUndo" type="button" data-tip="撤销">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
              </svg>
            </button>
            <button class="tool-btn is-disabled" id="tEraser" type="button" data-tip="橡皮" style="margin-right: 0.5rem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21" /><path d="m5.082 11.09 8.828 8.828" />
              </svg>
            </button>
            <button class="tool-btn" id="tPencil" type="button" data-tip="画笔">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" />
              </svg>
            </button>
            <button class="tool-btn" id="tHighlight" type="button" data-tip="荧光笔">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 11-6 6v3h9l3-3" /><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" />
              </svg>
            </button>
            <button class="tool-btn is-active" id="tPointer" type="button" data-tip="选择">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.037 4.688a.495.495 0 0 1 .651-.6l14.5 6.5a.5.5 0 0 1-.064.94l-5.38 1.2a1 1 0 0 0-.77.77l-1.2 5.38a.5.5 0 0 1-.94.064z" />
              </svg>
            </button>
            <button class="tool-btn is-disabled" id="tClear" type="button" data-tip="清空批注">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" />
              </svg>
            </button>
          </div>

          <!-- 右：功能 -->
          <div class="toolbar-right">
            <button class="tool-btn" id="bOutline" type="button" data-tip="页面目录">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 7v14" /><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
              </svg>
            </button>
            <button class="tool-btn" id="bAudio" type="button" data-tip="听力播放">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" />
              </svg>
            </button>
            <button class="tool-btn" id="bDownload" type="button" data-tip="下载试卷">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" />
              </svg>
            </button>
            <button class="tool-btn" id="bFullscreen" type="button" data-tip="进入全屏" aria-label="进入全屏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" />
              </svg>
            </button>
            <button class="tool-btn" id="bTheme" type="button" data-tip="切换主题">
              <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="reader-scroll" id="readerScroll">
        <div class="pages" id="pages"></div>
      </div>

      <div class="reader-status" id="status">
        <svg class="spinner" style="width: 2rem; height: 2rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <span id="statusText">正在加载试卷…</span>
      </div>

      <div class="page-nav is-hidden" id="pageNav">
        <button class="ghost-btn" id="pagePrev" type="button" data-tip="上一页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <span class="page-counter" id="pageCounter">1 / 1</span>
        <button class="ghost-btn" id="pageNext" type="button" data-tip="下一页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>

      <div class="audio-bar" id="audioBar" style="position: fixed; left: 1.5rem; bottom: 1.5rem; z-index: 50">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 0.875rem; height: 0.875rem; flex: none">
          <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" />
        </svg>
        <audio id="audio" controls preload="none"></audio>
      </div>
    </div>

    <div class="toast-layer" id="toastLayer"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/audio-manifest.js?v=20261109b"></script>
    <script src="assets/vendor/pdf.min.js"></script>
    <script src="assets/vendor/hls.min.js"></script>
    <script src="assets/js/reader.js?v=20261109b"></script>
  </body>
</html>
