<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习 words1</title>
    <!-- 引入外部CSS文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="wordContainer"></div>

    <button id="homeBtn" class="nav-btn">返回首页</button>
    <button id="nextBtn" class="nav-btn">下一个</button>

    <div class="counter">单词: <span id="currentIndex">1</span>/<span id="totalWords">0</span></div>

    <div id="translationModal" class="modal">
        <!-- 在modal-content中添加标记按钮 -->
<div class="modal-content">
    <h2 id="englishWord"></h2>
    <p id="chineseTranslation"></p>
    <div style="display: flex; gap: 10px; justify-content: center;">
        <button id="closeModal">知道了</button>
        <button id="markBtn">标记</button>
    </div>
</div>

    <!-- 引入单词学习系统的JS文件 -->
    <script src="words.js"></script>
    <script src="wordLearner.js">

    </script>

</body>
</html>
